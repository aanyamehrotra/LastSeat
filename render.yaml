services:
  - type: web
    name: lastseat-demo
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/aanyamehrotra/LastSeat
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh ./start-demo.sh
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lastseat-db
          property: connectionString
